name: Debug WTC7 Validate

on:
  push:
    branches: ["feat/wtc7-audit-v2"]

jobs:
  validate-tail:
    runs-on: ubuntu-latest
    steps:
      - name: Run compact validation
        shell: bash
        run: |
          git clone -q --depth 1 --branch feat/wtc7-audit-v2 https://github.com/alexdermohr/claim-audit-lab.git repo
          cd repo
          python -m pip install -q jsonschema pyyaml pytest
          set -o pipefail
          make validate 2>&1 | tail -80
